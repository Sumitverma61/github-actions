name: cicd

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: echo "code cloned from github"

  build:
    runs-on: ubuntu-latest
    needs: code

    steps:
      - name: Build docker container
        run: echo "docker container build"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test the container
        run: echo "testing the container"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy the app
        run: echo "deploying the application"
